# The Cloudflare stack (docs/cloudflare-stack.md): the Worker in worker/ and
# the web app in web/, tested on every pull request and every push to the two
# branches that matter, and deployed from cloudflare-workers only.
#
#   check    typecheck both, worker integration tests (Miniflare: real D1, R2,
#            Queues and the LiveHub DO, no Cloudflare account), the worker's
#            node --test suites, web vitest, web build. Uploads web/dist.
#   deploy   push to cloudflare-workers only: `wrangler deploy` of the Worker,
#            then the TEST Pages site (project school-erp-d1) with API_ORIGIN
#            pointing at the Worker.
#   preview  pull requests from this repository: a Pages branch deploy of the
#            PR's web build on school-erp-d1 (never production), URL in the
#            run summary.
#
# NEVER deploys the live Pages project "school-erp": that one builds from git
# on Cloudflare's side and talks to Cloud Run (web/wrangler.toml). The Pages
# steps below write their own wrangler.toml into a staging directory so the
# repo's web/wrangler.toml (name = "school-erp") is never what wrangler reads.
#
# Web vitest: a few tests were already red upstream before this workflow; they
# are listed in web/known-test-failures.txt and checked by
# web/scripts/check-test-failures.mjs, so any OTHER failure fails the build.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    Account: Workers Scripts Edit, Cloudflare Pages Edit,
#                           D1 Edit, Workers R2 Storage Edit, Queues Edit
#                           (details in docs/cloudflare-stack.md)
#   CLOUDFLARE_ACCOUNT_ID   the account id
name: worker

on:
  pull_request:
  push:
    branches: [cloudflare-workers, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKER_URL: https://school-erp.infovivencia2026.workers.dev
  PAGES_PROJECT: school-erp-d1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            web/package-lock.json

      # --legacy-peer-deps: how the lockfiles were made (vitest-pool-workers
      # pins vitest peers tighter than npm's resolver likes).
      - name: Install (worker)
        working-directory: worker
        run: npm ci --legacy-peer-deps

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Typecheck worker (src and tests)
        working-directory: worker
        run: npm run typecheck

      - name: Typecheck web
        working-directory: web
        run: npx tsc --noEmit

      # Catalogue, registry, route permissions, route registration and orphan
      # screens agree (scripts/feature.mjs, docs/feature-anatomy.md). Known
      # debt is in scripts/feature-check-baseline.json; anything new fails.
      - name: Feature consistency
        run: node scripts/feature.mjs check

      - name: Worker integration tests (Miniflare)
        working-directory: worker
        run: npx vitest run

      - name: Worker unit tests (provisioning, billing)
        working-directory: worker
        run: npm run test:unit

      - name: Web tests (known failures allowed, see web/known-test-failures.txt)
        working-directory: web
        run: npm run test:ci

      - name: Web build
        working-directory: web
        run: npx vite build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloudflare-workers'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One deploy at a time; a newer push waits rather than racing.
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install (worker)
        working-directory: worker
        run: npm ci --legacy-peer-deps

      - name: Deploy the Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 10 "$WORKER_URL/healthz" || true)
            [ "$body" = ok ] && { echo "healthz ok"; exit 0; }
            sleep 5
          done
          echo "::error::$WORKER_URL/healthz did not answer ok after deploy"; exit 1

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: pages/dist

      - name: Deploy the test Pages site (school-erp-d1)
        run: |
          set -euo pipefail
          cp -R web/functions pages/functions
          cat > pages/wrangler.toml <<EOF
          name = "$PAGES_PROJECT"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-09-01"
          [vars]
          API_ORIGIN = "$WORKER_URL"
          EOF
          grep -q "name = \"$PAGES_PROJECT\"" pages/wrangler.toml
          cd pages
          ../worker/node_modules/.bin/wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

  preview:
    needs: check
    # Secrets are not given to pull requests from forks; those only get `check`.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install wrangler
        working-directory: worker
        run: npm ci --legacy-peer-deps

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: pages/dist

      # A Pages *branch* deployment of school-erp-d1: its own URL
      # (pr-<n>.school-erp-d1.pages.dev), talking to the test Worker. Never
      # the production branch, never the live project.
      - name: Preview deploy
        run: |
          set -euo pipefail
          cp -R web/functions pages/functions
          cat > pages/wrangler.toml <<EOF
          name = "$PAGES_PROJECT"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-09-01"
          [vars]
          API_ORIGIN = "$WORKER_URL"
          EOF
          cd pages
          ../worker/node_modules/.bin/wrangler pages deploy dist --project-name "$PAGES_PROJECT" \
            --branch "pr-${{ github.event.pull_request.number }}" --commit-dirty=true | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)
          echo "### Preview: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
