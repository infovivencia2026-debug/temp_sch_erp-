# School ERP — one hostname, everything.
#
# The SPA owns the root namespace and serves all ~50 feature modules. The Go
# service is reached on a small set of explicit locations: the JSON API and the
# real authenticated pages the SPA has no equivalent for yet.
#
# Location matching is subtle here and got two things wrong on the first pass:
#   * "location /admin" is a PREFIX match, so it also captured the SPA's
#     /admin-portal module and sent it to Go, which 404d. Exact + subtree fixes it.
#   * "location /assets/" shadowed the SPA's own /assets module. Vite bundle
#     files always carry a file extension, so match on that instead.

server {
    server_name erp.187-127-178-100.sslip.io;

    root /var/www/vivencia-suite;
    index index.html;

    client_max_body_size 16m;

    access_log /var/log/nginx/school-erp.access.log;
    error_log  /var/log/nginx/school-erp.error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # ---- Go service -------------------------------------------------------
    location /api/     { include /etc/nginx/snippets/erp-proxy.conf; }
    location /healthz  { include /etc/nginx/snippets/erp-proxy.conf; access_log off; }
    location /login    { include /etc/nginx/snippets/erp-proxy.conf; }
    location /logout   { include /etc/nginx/snippets/erp-proxy.conf; }
    location /files/   { include /etc/nginx/snippets/erp-proxy.conf; }
    location /static/  { include /etc/nginx/snippets/erp-proxy.conf; expires 7d; access_log off; }

    location = /admin  { include /etc/nginx/snippets/erp-proxy.conf; }
    location /admin/   { include /etc/nginx/snippets/erp-proxy.conf; }
    location = /users  { include /etc/nginx/snippets/erp-proxy.conf; }
    location /users/   { include /etc/nginx/snippets/erp-proxy.conf; }
    location = /setup  { include /etc/nginx/snippets/erp-proxy.conf; }
    location /setup/   { include /etc/nginx/snippets/erp-proxy.conf; }

    # The staff-app install page. Exact match only: a prefix would also
    # capture anything the SPA later mounts under /apps, which is the mistake
    # /admin made above.
    location = /apps   { include /etc/nginx/snippets/erp-proxy.conf; }

    # The APKs themselves. Regex, so it is evaluated before the "/" prefix that
    # would otherwise hand a download to the SPA shell.
    #
    # proxy_buffering off, because the default is to spool the whole response
    # to a temp file before sending a byte of it: on a forty-megabyte APK that
    # is a long silent wait and then a burst, which on a phone reads as a
    # download that failed. Streaming it also means the Range request that
    # resumes an interrupted download reaches Go rather than being served from
    # a buffer of the wrong bytes.
    location ~ ^/apps/[a-z0-9-]+\.apk$ {
        include /etc/nginx/snippets/erp-proxy.conf;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        # Never cached: the URL is stable across releases while the file behind
        # it is not, so a cached copy is how a school reinstalls last month's
        # build and cannot tell.
        add_header Cache-Control "no-store" always;
    }

    # ---- SPA --------------------------------------------------------------
    # Only real bundle files, identified by extension. Regex locations are
    # evaluated before the "/" prefix, so these win; /assets with no extension
    # falls through to the SPA router as the asset-management module.
    location ~ ^/assets/.+\.(js|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # BrowserRouter: deep links such as /students/admitted fall through here.
    location / {
        # The shell must always revalidate. A 'location = /index.html' block
        # does not cover this: a request for '/' is rewritten internally by
        # try_files and never enters an exact-match location, so without this
        # header browsers pin to a stale bundle after every deploy.
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;  # no $uri/ — it would 301 /assets to the real directory
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.187-127-178-100.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.187-127-178-100.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = erp.187-127-178-100.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name erp.187-127-178-100.sslip.io;
    listen 80;
    return 404; # managed by Certbot


}