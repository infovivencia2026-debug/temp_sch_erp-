<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send a test message</title>
<!--
  THE TEST PAGE, WITH NO SIGN-IN.

  Deliberately one file with no build step and no dependency on the app. The
  thing it is for is checking whether a channel works, often from the phone
  being tested rather than the machine somebody is signed in on, and often when
  the app itself is the thing under suspicion. A page that needs the app to
  work cannot answer "does the app work".

  The key in the URL is what replaces the session. See
  internal/api/message_test_link.go for why that is safe: the recipient
  allowlist still stands in front of every send, the link is rate limited, and
  it stops working the moment a school takes its guard off allowlist mode.
-->
<style>
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f7f7f8; color: #111; margin: 0; padding: 24px 16px; }
  .card { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e3e3e6;
          border-radius: 4px; padding: 24px; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #555; font-size: 14px; }
  label { display: block; margin-top: 16px; font-size: 14px; }
  select, input, textarea { width: 100%; box-sizing: border-box; margin-top: 5px;
    padding: 10px 12px; font-size: 15px; border: 1px solid #c9c9cf; border-radius: 3px;
    background: #fff; color: #111; font-family: inherit; }
  button { margin-top: 20px; width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    color: #fff; background: #111; border: 0; border-radius: 3px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 16px; font-size: 14px; white-space: pre-wrap; }
  .ok { color: #1c6b3f; } .bad { color: #b3261e; }
  .note { margin-top: 18px; font-size: 12.5px; color: #666; line-height: 1.5; }
</style>

<div class="card">
  <h1>Send a test message</h1>
  <p class="sub">Goes through the real dispatcher, on the real provider.</p>

  <div id="nokey" style="display:none" class="bad">
    This link is missing its key. Get a fresh one from
    Admin &rarr; Messaging.
  </div>

  <form id="f" style="display:none">
    <label>Channel
      <select id="channel">
        <option value="email">Email</option>
        <option value="sms">SMS</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="in_app">In-app</option>
      </select>
    </label>
    <label>To
      <input id="to" placeholder="name@example.com or 9000000000" required>
    </label>
    <label>Message
      <textarea id="body" rows="3">This is a test message from the school office.</textarea>
    </label>
    <button id="go" type="submit">Send</button>
  </form>

  <div id="out"></div>

  <p class="note">
    The recipient allowlist still applies: an address that is not on it is
    recorded and held rather than sent. Ten messages an hour on this link.
  </p>
</div>

<script>
  var key = new URLSearchParams(location.search).get('key') || ''
  document.getElementById(key ? 'f' : 'nokey').style.display = 'block'

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault()
    var out = document.getElementById('out')
    var btn = document.getElementById('go')
    btn.disabled = true
    out.textContent = 'Sending…'
    out.className = ''
    try {
      var res = await fetch('/api/v1/public/message-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          key: key,
          channel: document.getElementById('channel').value,
          to: document.getElementById('to').value,
          body: document.getElementById('body').value,
        }),
      })
      var b = await res.json().catch(function () { return null })
      if (!res.ok) {
        out.className = 'bad'
        /* The server's own sentence, not a status code. Every refusal on this
           path already explains itself -- "the office phone has not reported
           in for 4 days", "no approved template is mapped" -- and replacing
           that with "Error 502" throws away the only useful part. */
        out.textContent = (b && b.error && b.error.message) || ('Failed: ' + res.status)
      } else {
        out.className = 'ok'
        out.textContent = b && b.note ? b.note : 'Queued.'
      }
    } catch (err) {
      out.className = 'bad'
      out.textContent = 'Could not reach the server: ' + err.message
    }
    btn.disabled = false
  })
</script>
