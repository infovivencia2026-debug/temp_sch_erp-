<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment</title>
  <!--
    ONE FILE, NO INTERNET NEEDED.
    The QR encoder (qrcodejs 1.0.0, MIT, davidshimjs) is embedded below, so this
    page works from a USB stick, a phone's downloads folder, or a laptop with
    no connection. Nothing is fetched. Edit the DEFAULTS block to preset the
    school's UPI ID and name.
  -->
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fc;
      --text: #17191f;
      --muted: #727782;
      --faint: #9a9fa9;
      --card-line: rgba(255, 255, 255, 0.92);
      --field-line: rgba(44, 52, 78, 0.12);
      --accent: #83a7ff;
      --danger: #d9486f;
      --radius: 36px;
      --shadow: 0 18px 45px rgba(44, 52, 78, 0.08), 0 5px 15px rgba(44, 52, 78, 0.035);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      padding: clamp(24px, 6vw, 64px) 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background:
        radial-gradient(circle at 8% 3%, rgba(176, 149, 255, 0.13), transparent 28%),
        radial-gradient(circle at 92% 10%, rgba(116, 203, 255, 0.15), transparent 30%),
        radial-gradient(circle at 55% 97%, rgba(113, 220, 184, 0.10), transparent 32%),
        var(--bg);
    }
    .wrap { width: 100%; max-width: 460px; display: grid; gap: 20px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 13px; border-radius: 999px;
      background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.86);
      box-shadow: 0 8px 24px rgba(55,64,90,.05);
      font-size: 12px; font-weight: 650; color: #606570; letter-spacing: .01em;
    }
    .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(131,167,255,.12); }
    h1 { margin-top: 14px; font-size: clamp(32px, 8vw, 42px); line-height: 1; letter-spacing: -1.5px; font-weight: 700; }
    .lede { margin-top: 10px; color: var(--muted); font-size: 14.5px; max-width: 38ch; }

    .card {
      position: relative; isolation: isolate; overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--card-line);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.92);
      padding: 28px 24px;
      background:
        radial-gradient(ellipse at 24% 30%, #fff 0%, rgba(255,255,255,.92) 18%, rgba(244,240,255,.72) 36%, rgba(244,240,255,.18) 58%, transparent 74%),
        radial-gradient(ellipse at 95% 90%, #ffb7d7 0%, #f6a5cc 22%, rgba(241,163,207,.45) 44%, transparent 68%),
        radial-gradient(ellipse at 0% 100%, #8dacff 0%, #a9bcff 26%, rgba(176,195,255,.40) 48%, transparent 70%),
        linear-gradient(120deg, #e1e8ff, #faf3ff 48%, #ffd8e9);
    }
    .card.result {
      text-align: center;
      background: radial-gradient(ellipse at 50% 42%, #fff 0%, #eefaff 14%, #d2edff 34%, #acd6ff 58%, #8ab8f3 82%, #719ee0 100%);
    }
    .num { position: absolute; left: 22px; top: 20px; font-size: 11px; font-weight: 650; letter-spacing: .04em; color: rgba(28,31,40,.36); }

    form { display: grid; gap: 14px; margin-top: 8px; }
    .group { display: grid; gap: 6px; }
    label { font-size: 12.5px; font-weight: 600; color: #606570; display: flex; justify-content: space-between; }
    label .opt { font-weight: 400; color: var(--faint); }
    input {
      width: 100%; height: 46px; padding: 0 14px;
      border: 1px solid var(--field-line); border-radius: 16px;
      background: rgba(255,255,255,.8); color: var(--text); font: inherit; outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    }
    input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(131,167,255,.28); }
    input[aria-invalid="true"] { border-color: var(--danger); }
    #upiId, #amount { font-family: var(--mono); }
    #amount { font-variant-numeric: tabular-nums; }

    button, .link {
      width: 100%; height: 46px; border: 1px solid rgba(255,255,255,.86); border-radius: 999px;
      font: inherit; font-weight: 650; cursor: pointer; color: var(--text);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { margin-top: 4px; background: linear-gradient(120deg, #a9bcff, #d9c9ff 50%, #ffb7d7); box-shadow: 0 10px 26px rgba(131,167,255,.28), inset 0 1px 0 rgba(255,255,255,.8); }
    .secondary { background: rgba(255,255,255,.72); box-shadow: 0 8px 24px rgba(55,64,90,.06); }
    .link { display: block; text-decoration: none; line-height: 44px; text-align: center; }
    .error { color: var(--danger); font-size: 13px; font-weight: 500; margin-top: 10px; }

    .result-body { display: grid; gap: 12px; justify-items: center; padding-top: 10px; }
    .amount { font-family: var(--mono); font-size: 30px; font-weight: 500; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
    .payee { font-size: 13px; color: rgba(23,25,31,.62); word-break: break-all; margin-top: -4px; }
    #qrcode { display: flex; justify-content: center; align-items: center; min-height: 236px; }
    #qrcode canvas, #qrcode img {
      width: 236px !important; height: 236px !important; max-width: 100%;
      padding: 10px; background: #fff; border: 1px solid rgba(255,255,255,.95); border-radius: 28px;
      box-shadow: 0 18px 40px rgba(44,52,78,.14), inset 0 1px 0 #fff; image-rendering: pixelated;
    }
    .loading { color: rgba(23,25,31,.5); font-size: 13px; }
    .actions { width: 100%; display: grid; gap: 10px; margin-top: 4px; }
    .uri {
      width: 100%; font-family: var(--mono); font-size: 11px; line-height: 1.5; color: rgba(23,25,31,.66);
      background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.9); border-radius: 14px;
      padding: 9px 12px; text-align: left; word-break: break-all; user-select: all;
    }
    .hint { font-size: 12px; color: rgba(23,25,31,.5); }
    .toast { font-size: 13px; color: #3d63c9; font-weight: 500; min-height: 1.2em; }

    @media (max-width: 520px) { :root { --radius: 28px; } .card { padding: 24px 18px; } }
    @media print {
      body { background: #fff; padding: 0; }
      .wrap { max-width: none; }
      header, .card:not(.result), .actions, .toast, .uri { display: none !important; }
      .card.result { border: 0; box-shadow: none; background: #fff; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow"><i></i>UPI / OFFLINE</div>
    <h1>Scan. Pay. Done.</h1>
    <p class="lede">Works with no internet. The amount and note are inside the code, so the payer types nothing.</p>
  </header>

  <section class="card">
    <span class="num">01</span>
    <form id="upiForm" novalidate>
      <div class="group">
        <label for="upiId">UPI ID (VPA)</label>
        <input id="upiId" placeholder="name@bank" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="email">
      </div>
      <div class="group">
        <label for="payeeName">Payee name</label>
        <input id="payeeName" placeholder="School or payee name" autocomplete="off" maxlength="99">
      </div>
      <div class="group">
        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="group">
        <label for="note">Note <span class="opt">optional · admission no. goes here</span></label>
        <input id="note" placeholder="e.g. Fee ADM/2026/0142" autocomplete="off" maxlength="50">
      </div>
      <button class="primary" id="generateButton" type="submit">Generate QR code</button>
    </form>
    <div id="error" class="error" role="alert" aria-live="polite" hidden></div>
  </section>

  <section id="result" class="card result" hidden>
    <span class="num">02</span>
    <div class="result-body">
      <div id="displayAmount" class="amount"></div>
      <div id="displayPayee" class="payee"></div>
      <div id="qrcode"><span class="loading">Generating QR…</span></div>
      <div class="actions">
        <a id="payLink" class="secondary link" href="#">Open in a UPI app (mobile)</a>
        <button class="secondary" id="downloadButton" type="button">Save QR image</button>
        <button class="secondary" id="printButton" type="button">Print</button>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="uriText" class="uri" title="Encoded UPI intent"></div>
      <p class="hint">Scan with any UPI app · GPay, PhonePe, Paytm, BHIM.</p>
    </div>
  </section>
</div>

  inputs.amount.value = DEFAULTS.amount;
  inputs.note.value = DEFAULTS.note;

  let currentQR = null;
  let debounceTimer = null;

  // NPCI VPA: handle@psp, both parts alphanumerics plus . - _
  const VPA_RE = /^[a-z0-9._-]{3,}@[a-z0-9]{2,}$/i;

  function validate() {
    const vpa = inputs.vpa.value.trim();
    const name = inputs.name.value.trim();
    const amountRaw = inputs.amount.value.trim();
    const note = inputs.note.value.trim();
    Object.values(inputs).forEach(function (el) { el.removeAttribute("aria-invalid"); });

    if (!VPA_RE.test(vpa)) return fail(inputs.vpa, "Enter a valid UPI ID, for example name@bank.");
    if (!name) return fail(inputs.name, "Enter the payee name.");
    // Round to paise first so 0.004 and 1e-9 don't slip through as "> 0".
    const amount = Math.round(Number(amountRaw) * 100) / 100;
    if (!amountRaw || !Number.isFinite(amount) || amount < 0.01) return fail(inputs.amount, "Enter an amount of at least ₹0.01.");
    if (amount > 100000) return fail(inputs.amount, "UPI transactions are capped at ₹1,00,000.");
    return { ok: true, vpa: vpa, name: name, amount: amount, note: note };
  }
  function fail(el, message) { el.setAttribute("aria-invalid", "true"); return { ok: false, message: message }; }

  /* UPI apps parse the intent as an RFC 3986 URI, not as a submitted form.
     URLSearchParams would encode spaces as "+" (shown literally by apps)
     and "@" as "%40" (rejected by some), so build the query by hand. */
  function buildUpiUri(d) {
    const parts = ["pa=" + d.vpa, "pn=" + encodeURIComponent(d.name), "am=" + d.amount.toFixed(2), "cu=INR"];
    if (d.note) parts.push("tn=" + encodeURIComponent(d.note));
    return "upi://pay?" + parts.join("&");
  }

  function generateQR() {
    hideError();
    toast.textContent = "";
    const data = validate();
    if (!data.ok) { showError(data.message); return; }

    const upiUri = buildUpiUri(data);
    const container = $("qrcode");
    container.innerHTML = "";
    try {
      new QRCode(container, {
        text: upiUri, width: 220, height: 220,
        colorDark: "#17191f", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      console.error(e);
      container.innerHTML = '<span class="loading">-</span>';
      showError("Could not generate the QR code. Try a shorter name or note.");
      return;
    }
    currentQR = { uri: upiUri, amount: data.amount };
    $("displayAmount").textContent = "₹" + formatINR(data.amount);
    $("displayPayee").textContent = data.name + " · " + data.vpa;
    $("payLink").href = upiUri;
    $("uriText").textContent = upiUri;
    $("result").hidden = false;
  }

  function formatINR(n) {
    try { return n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    catch (e) { return n.toFixed(2); }
  }
  function showError(message) { errorBox.textContent = message; errorBox.hidden = false; }
  function hideError() { errorBox.hidden = true; }

  function downloadQR() {
    if (!currentQR) { showError("Generate the QR code first."); return; }
    const canvas = document.querySelector("#qrcode canvas");
    const img = document.querySelector("#qrcode img");
    const dataUrl = canvas ? canvas.toDataURL("image/png") : (img && img.src) || "";
    if (dataUrl.indexOf("data:image") !== 0) {
      showError("This browser can't export the image. Long-press or right-click the QR to save it, or use Print.");
      return;
    }
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = "UPI_" + currentQR.amount.toFixed(2).replace(".", "_") + "_INR.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast.textContent = "Saved " + a.download;
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); generateQR(); });
  $("downloadButton").addEventListener("click", downloadQR);
  $("printButton").addEventListener("click", function () { window.print(); });
  Object.values(inputs).forEach(function (el) {
    el.addEventListener("input", function () {
      if (!currentQR) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(generateQR, 300);
    });
  });

  if (typeof QRCode === "undefined") {
    showError("The QR encoder is missing from this file. Re-download the page.");
    $("generateButton").disabled = true;
  } else {
    generateQR();
  }
</script>
</body>
</html>
