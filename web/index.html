<!doctype html>
<html lang="en-IN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- NO PINCH ZOOM, AND THE REASON IT IS DEFENSIBLE HERE.

         Blocking zoom is normally an accessibility fault: it takes away the
         one way a person with poor sight can read a page. This product has the
         alternative built in and better than the browser's, which is why the
         trade is worth making. App text size is a slider in Settings that
         reflows the layout rather than magnifying it, so text gets bigger and
         still fits the screen, where a pinch leaves somebody dragging a
         too-wide page sideways to read one line.

         What it buys: the board is a paged home screen with cards that are
         dragged and a strip that swipes. Pinch and pan on top of that means a
         two-finger scroll leaves the board at 1.4x with no way back that
         anybody discovers, and a drag that starts a fraction off becomes a
         pan. Measured on the phone: this is the fault behind "it zooms and
         moves". -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>WISEN</title>

    <!-- INSTALLABLE, RATHER THAN A SECOND APP TO MAINTAIN.

         A parent asked for "the parent app". There is no parent APK and there
         should not be one: the portal is already the parent's whole product,
         it is already responsive, and a WebView wrapper would be a second
         thing to sign, ship and update for no behaviour the browser does not
         already give. A manifest makes the same site installable to the home
         screen, with its own icon and no browser chrome, on Android and iOS
         alike, and a school that never installs it loses nothing. -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads none of the manifest's icons and needs its own tag. -->
    <link rel="apple-touch-icon" href="/app/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WISEN" />
    <script>
      // Apply persisted theme before first paint to avoid flash.
      try {
        // 'system' is the default this product ships (lib/theme.ts
        // DEFAULT_THEME), and this line said 'light'. So a visitor whose
        // machine is dark, and who has never chosen anything, was painted a
        // light page here and a dark one a moment later when the app read the
        // same preference properly -- the exact flash this script exists to
        // prevent, and on the front door it is the first thing anybody sees.
        var raw = localStorage.getItem('erp.theme')
        var t = raw ? JSON.parse(raw) : 'system'
        var dark = t === 'dark' ||
          (t === 'system' && window.matchMedia &&
           matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        var d = localStorage.getItem('erp.density') || '"comfortable"'
        document.documentElement.dataset.density = JSON.parse(d)
        var p = localStorage.getItem('erp.personality')
        if (p && p !== 'classic') document.documentElement.dataset.personality = p
      } catch (e) {}
    </script>
    <!-- The ground from the very first frame, before the stylesheet arrives,
         so a load never flashes white and then tints. -->
    <style>html{background:#eef0f6}html.dark{background:#08080a}</style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script>
      // THE SCHOOL, BEFORE THE BUNDLE. On a slow line the JavaScript takes
      // seconds, and all that showed was the page ground. The school's name
      // and logo (lib/brand.ts rememberSchoolMark, erp.schoolMark) are drawn
      // here at once; React's first render replaces #root's content, so
      // nothing has to take them down. Nothing is drawn on a first visit.
      try {
        var m = JSON.parse(localStorage.getItem('erp.schoolMark') || 'null')
        if (m && m.name) {
          var r = document.getElementById('root')
          var w = document.createElement('div')
          w.style.cssText = 'height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:600 17px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:' + (document.documentElement.classList.contains('dark') ? '#e8e8ee' : '#1c1d24')
          if (m.logo && /^data:image\//.test(m.logo)) {
            var i = document.createElement('img')
            i.src = m.logo; i.alt = ''; i.width = 64; i.height = 64
            i.style.cssText = 'width:64px;height:64px;object-fit:contain;border-radius:14px'
            w.appendChild(i)
          }
          var n = document.createElement('div')
          n.textContent = m.name
          w.appendChild(n)
          r.appendChild(w)
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
