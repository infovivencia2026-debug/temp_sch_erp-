<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EDU CLOUD</title>
    <script>
      // Apply persisted theme before first paint to avoid flash.
      try {
        var t = localStorage.getItem('erp.theme') || '"light"'
        if (JSON.parse(t) === 'dark') document.documentElement.classList.add('dark')
        var d = localStorage.getItem('erp.density') || '"comfortable"'
        document.documentElement.dataset.density = JSON.parse(d)
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
