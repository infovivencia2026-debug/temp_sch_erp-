<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EvenTum - Discover Nearby Events</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a0b2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        /* Mobile Device Frame Container */
        .phone-container {
            width: 100%;
            max-width: 410px;
            height: 100vh;
            max-height: 840px;
            background: linear-gradient(180deg, #18092d 0%, #0d0418 100%);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 8px solid #2a164a;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 12px;
        }

        /* Screen Views (For Toggle) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 24px 36px 24px;
            transition: opacity 0.4s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- SCREEN 1: Welcome / Discover --- */
        .screen-one .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .header-logo span {
            background: #8b5cf6;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 14px;
        }

        .screen-one .hero-content {
            margin-top: 20px;
            z-index: 2;
        }

        .screen-one h1 {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .hero-image-wrapper {
            position: absolute;
            bottom: 90px;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            z-index: 1;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
        }

        /* --- SCREEN 2: Auth Options --- */
        .screen-two {
            justify-content: flex-start;
            padding-top: 40px;
        }

        .screen-two .auth-hero-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 24px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
        }

        .auth-text-center {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-text-center h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .auth-text-center p {
            font-size: 13px;
            color: #a78bfa;
            line-height: 1.4;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
            transition: transform 0.1s, opacity 0.2s;
            z-index: 5;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-social {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn-social:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .auth-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 0px;
            width: 100%;
        }

        /* Footer legal text */
        .legal-footer {
            font-size: 11px;
            color: #8b5cf6;
            text-align: center;
            line-height: 1.4;
            margin-top: auto;
        }

        .legal-footer a {
            color: #c084fc;
            text-decoration: underline;
        }

        /* Background sparkles / stars effect */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <!-- SCREEN 1: Discover Nearby Events -->
        <div class="screen screen-one active" id="screen1">
            <div>
                <div class="header-logo">
                    <span>A</span> EvenTum
                </div>
                <div class="hero-content">
                    <h1>Discover<br>Nearby<br>Events</h1>
                </div>
            </div>

            <!-- Singer / Concert Graphic Background -->
            <div class="hero-image-wrapper">
                <img src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=800&auto=format&fit=crop" alt="Concert Singer">
            </div>

            <!-- Sparkle decorations -->
            <div class="sparkle" style="top: 25% ; right: 15%; width: 4px; height: 4px;"></div>
            <div class="sparkle" style="top: 40% ; left: 10%; width: 3px; height: 3px;"></div>
            <div class="sparkle" style="top: 55% ; right: 20%; width: 5px; height: 5px;"></div>

            <button class="btn-primary" onclick="switchScreen()">Get Started</button>
        </div>

        <!-- SCREEN 2: Authentication Options -->
        <div class="screen screen-two" id="screen2">
            <div>
                <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=800&auto=format&fit=crop" class="auth-hero-img" alt="Crowd at event">
                
                <div class="auth-text-center">
                    <h2>Let get started</h2>
                    <p>Sign up or log in to see what's happening near you</p>
                </div>

                <div class="auth-buttons-group">
                    <a href="#" class="btn-primary" style="margin-bottom: 12px; text-align: center;">Continue With Email</a>
                    <a href="#" class="btn-social">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                        Continue With facebook
                    </a>
                    <a href="#" class="btn-social">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.36 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 12s.43 3.88 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                        Continue With Google
                    </a>
                </div>
            </div>

            <div class="legal-footer">
                By signing up or logging in, I accept the Evenie<br>
                <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </div>
        </div>
    </div>

    <!-- Simple JS to toggle between screens for previewing -->
    <script>
        function switchScreen() {
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
        }
    </script>

</body>
</html>
