<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expandable iOS Pastel Menu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .menu-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Main Menu Item / Card Wrapper */
        .menu-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            padding: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .menu-card.expanded {
            border-radius: 28px;
            border-color: var(--theme-color);
            box-shadow: 0 10px 20px -3px var(--shadow-color), 0 4px 6px -4px var(--shadow-color);
            background-color: var(--hover-bg);
        }

        .menu-item {
            background-color: #ffffff;
            border-radius: 50px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #1e293b;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.25s ease;
            width: 100%;
            box-sizing: border-box;
            border: none;
        }

        .menu-card.expanded .menu-item {
            background-color: transparent;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--badge-bg);
            color: var(--theme-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }

        .icon-badge svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .arrow {
            color: #cbd5e1;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.3s ease, color 0.25s;
        }

        .menu-card.expanded .arrow {
            transform: rotate(90deg);
            color: var(--theme-color);
        }

        /* Sub-menu styling for expanded state */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 16px;
        }

        .menu-card.expanded .submenu {
            max-height: 300px;
            padding-bottom: 14px;
        }

        .submenu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            text-decoration: none;
            color: #475569;
            font-size: 15px;
            font-weight: 500;
            border-radius: 14px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .submenu-item:hover {
            background-color: rgba(255, 255, 255, 0.7);
            color: var(--theme-color);
        }

        .submenu-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        
        <!-- Expandable My Classes Card -->
        <div class="menu-card expanded" id="myClassesCard" style="--theme-color: #0284c7; --badge-bg: #e0f2fe; --hover-bg: #f0f9ff; --shadow-color: rgba(2, 132, 199, 0.1);">
            <button class="menu-item" onclick="toggleMenu('myClassesCard')">
                <div class="menu-left">
                    <div class="icon-badge">
                        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                    </div>
                    <span>My Classes</span>
                </div>
                <span class="arrow">&#10095;</span>
            </button>
            <div class="submenu">
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    <span>Student progress</span>
                </a>
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span>My students</span>
                </a>
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.03-.42 1.98-1.07 2.75z"/></svg>
                    <span>Class 360</span>
                </a>
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    <span>Concerns from parents</span>
                </a>
            </div>
        </div>

        <!-- Attendance -->
        <div class="menu-card" id="attendanceCard" style="--theme-color: #059669; --badge-bg: #d1fae5; --hover-bg: #ecfdf5; --shadow-color: rgba(5, 150, 105, 0.1);">
            <button class="menu-item" onclick="toggleMenu('attendanceCard')">
                <div class="menu-left">
                    <div class="icon-badge">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </div>
                    <span>Attendance</span>
                </div>
                <span class="arrow">&#10095;</span>
            </button>
            <div class="submenu">
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
                    <span>Daily Log</span>
                </a>
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path></svg>
                    <span>Audit Reports</span>
                </a>
            </div>
        </div>

        <!-- Teaching -->
        <div class="menu-card" id="teachingCard" style="--theme-color: #7c3aed; --badge-bg: #ede9fe; --hover-bg: #f5f3ff; --shadow-color: rgba(124, 58, 237, 0.1);">
            <button class="menu-item" onclick="toggleMenu('teachingCard')">
                <div class="menu-left">
                    <div class="icon-badge">
                        <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.25 19.5c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l2.09-2.09C9.33 19.26 10.63 19.5 12 19.5c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm1-9.5h-2v4l3.5 2.1.75-1.23-2.25-1.37V8.5z"/></svg>
                    </div>
                    <span>Teaching</span>
                </div>
                <span class="arrow">&#10095;</span>
            </button>
            <div class="submenu">
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6z"/></svg>
                    <span>Lesson Plans</span>
                </a>
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                    <span>Syllabus Progress</span>
                </a>
            </div>
        </div>

        <!-- Timetable -->
        <div class="menu-card" id="timetableCard" style="--theme-color: #d97706; --badge-bg: #fef3c7; --hover-bg: #fffbeb; --shadow-color: rgba(217, 119, 6, 0.1);">
            <button class="menu-item" onclick="toggleMenu('timetableCard')">
                <div class="menu-left">
                    <div class="icon-badge">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    </div>
                    <span>Timetable</span>
                </div>
                <span class="arrow">&#10095;</span>
            </button>
            <div class="submenu">
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect></svg>
                    <span>Master Timetable</span>
                </a>
            </div>
        </div>

        <!-- Communication -->
        <div class="menu-card" id="commCard" style="--theme-color: #e11d48; --badge-bg: #ffe4e6; --hover-bg: #fff1f2; --shadow-color: rgba(225, 29, 72, 0.1);">
            <button class="menu-item" onclick="toggleMenu('commCard')">
                <div class="menu-left">
                    <div class="icon-badge">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                    </div>
                    <span>Communication</span>
                </div>
                <span class="arrow">&#10095;</span>
            </button>
            <div class="submenu">
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
                    <span>Announcements</span>
                </a>
            </div>
        </div>

        <!-- School Gallery -->
        <div class="menu-card" id="galleryCard" style="--theme-color: #db2777; --badge-bg: #fce7f3; --hover-bg: #fdf2f8; --shadow-color: rgba(219, 39, 119, 0.1);">
            <button class="menu-item" onclick="toggleMenu('galleryCard')">
                <div class="menu-left">
                    <div class="icon-badge">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5C21 3.9 20.1 3 19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19ZM8.5 13.5L11 16.5L14.5 12L19 18H5L8.5 13.5Z"/></svg>
                    </div>
                    <span>School Gallery</span>
                </div>
                <span class="arrow">&#10095;</span>
            </button>
            <div class="submenu">
                <a href="#" class="submenu-item">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                    <span>Photo Albums</span>
                </a>
            </div>
        </div>

    </div>

    <script>
        function toggleMenu(cardId) {
            const card = document.getElementById(cardId);
            // Optional: Close other open cards if you only want one open at a time
            // document.querySelectorAll('.menu-card').forEach(c => { if(c.id !== cardId) c.classList.remove('expanded'); });
            
            card.classList.toggle('expanded');
        }
    </script>

</body>
</html>
