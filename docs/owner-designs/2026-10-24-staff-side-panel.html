<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar Navigation - Light Theme Clean</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-drawer: #ffffff;
      --surface-card: #f8fafc;
      --surface-hover: #f1f5f9;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-subtle: #e2e8f0;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Mobile Drawer Frame */
    .drawer-container {
      width: 100%;
      max-width: 440px;
      height: 940px;
      background: var(--bg-drawer);
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(15, 23, 42, 0.15);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    /* Header */
    .drawer-header {
      padding: 22px 24px 18px;
      background: var(--bg-drawer);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .school-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .school-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      display: grid;
      place-items: center;
      background: #eff6ff;
    }

    .school-logo svg {
      width: 26px;
      height: 26px;
      color: var(--primary);
    }

    .school-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .school-role {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 3px;
    }

    .btn-close {
      border: none;
      background: #f1f5f9;
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.15s, color 0.15s;
    }

    .btn-close:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    /* Scrollable Menu Area */
    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Category Cards (No left border accent lines) */
    .menu-group {
      background: var(--surface-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      background: transparent;
      transition: background 0.15s;
    }

    .group-header:hover {
      background: var(--surface-hover);
    }

    .group-header svg.chevron {
      color: var(--text-muted);
    }

    .sub-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px 10px 12px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-item:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
      flex-shrink: 0;
    }

    /* Anchored Footer */
    .drawer-footer {
      background: var(--bg-drawer);
      border-top: 1px solid var(--border-subtle);
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Focus / Work Segmented Control */
    .mode-switch-wrapper {
      background: #f1f5f9;
      padding: 4px;
      border-radius: var(--radius-pill);
      display: flex;
      border: 1px solid var(--border-subtle);
    }

    .mode-tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* Teacher Profile & Actions Card */
    .profile-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar-circle {
      width: 42px;
      height: 42px;
      background: #2563eb;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      flex-shrink: 0;
    }

    .user-text {
      min-width: 0;
    }

    .user-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 1px;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text-main);
    }

    .icon-btn.sign-out:hover {
      background: var(--danger-light);
      color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="drawer-container">
    <!-- Top Header -->
    <header class="drawer-header">
      <div class="school-info">
        <div class="school-logo">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
        </div>
        <div>
          <h1 class="school-name">YAJUR PUBLIC SCHOOL</h1>
          <p class="school-role">Faculty &amp; Staff Portal</p>
        </div>
      </div>
      <button class="btn-close" aria-label="Close menu">✕</button>
    </header>

    <!-- Scrollable Nav Groups -->
    <main class="drawer-content">
      <!-- Home -->
      <section class="menu-group">
        <div class="group-header">
          <span>Home</span>
          <svg class="chevron" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
        <div class="sub-items">
          <a href="#" class="nav-item active">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Today's classes
          </a>
        </div>
      </section>

      <!-- My Classes -->
      <section class="menu-group">
        <div class="group-header">
          <span>My Classes</span>
          <svg class="chevron" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
        <div class="sub-items">
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Student progress
          </a>
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Class 360
          </a>
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            Concerns from parents
          </a>
        </div>
      </section>

      <!-- Attendance -->
      <section class="menu-group">
        <div class="group-header">
          <span>Attendance</span>
          <svg class="chevron" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
        <div class="sub-items">
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            Take attendance
          </a>
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            Student leave requests
          </a>
        </div>
      </section>

      <!-- Teaching -->
      <section class="menu-group">
        <div class="group-header">
          <span>Teaching</span>
          <svg class="chevron" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
        <div class="sub-items">
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            Homework / classwork
          </a>
          <a href="#" class="nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Assignments &amp; submissions
          </a>
        </div>
      </section>
    </main>

    <!-- Anchored Footer -->
    <footer class="drawer-footer">
      <!-- Focus / Work Segmented Control -->
      <div class="mode-switch-wrapper">
        <button class="mode-tab">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" stroke-width="2"/>
            <path stroke-width="2" d="M12 7v5l3 2"/>
          </svg>
          Focus
        </button>
        <button class="mode-tab active">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          Work
        </button>
      </div>

      <!-- User Profile & Action Bar -->
      <div class="profile-card">
        <div class="profile-info">
          <div class="avatar-circle">FT</div>
          <div class="user-text">
            <div class="user-name">Faculty Teacher</div>
            <div class="user-subtitle">teacher@yjps.xulo.in</div>
          </div>
        </div>

        <div class="footer-actions">
          <!-- Help / Support -->
          <button class="icon-btn" title="Help">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>
          
          <!-- Settings -->
          <button class="icon-btn" title="Settings">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>

          <!-- Safe, Isolated Sign Out Button -->
          <button class="icon-btn sign-out" title="Sign Out">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

</body>
</html>
