# The fallback the secrets plugin uses when secrets.properties is absent.
#
# Not empty, on purpose. The plugin drops an empty value into
# BuildConfig.MAPS_API_KEY unquoted, which produced
# `public static final String MAPS_API_KEY = ;` and the release build failed
# to compile on any checkout without the secret. A non-empty placeholder is
# quoted properly, the manifest placeholder is filled, and the app builds and
# draws a blank map with Google's authorisation failure in logcat -- which is
# the behaviour this file exists to provide. Put the real key in
# secrets.properties (git-ignored).
MAPS_API_KEY=unset
