# temperp-worker on Cloud Run: OPTIONAL, and PAID. Not deployed by default.
#
# The default design has no worker service at all. service-web.yaml runs the
# River workers inside the web process (QUEUE_INPROCESS=1) and Cloud Scheduler
# ticks /api/v1/cron, so one scale-to-zero service is the whole ERP and the
# Cloud Run line is ₹0. deploy.sh applies this manifest only with --with-worker.
#
# Why it still exists: a worker on Cloud Run is only useful always-on. River
# wakes a worker over Postgres LISTEN/NOTIFY or by polling, and Cloud Run
# starts a container for an HTTP request and for nothing else -- so minScale 0
# on this service is a worker that works nothing, and minScale 1 with CPU
# always allocated is ~₹4,000/month (one vCPU for a month at instance-based
# pricing, before the free tier), several times the whole plan. That is the
# price of this file. Pay it in exactly two situations:
#
#   1. Push notifications to the parent app. cmd/worker runs RunPushPump
#      (FCM); cmd/web does not, so until push is moved into the web process
#      or a cron entry, notifications exist only while this service runs.
#   2. A job that must have unthrottled CPU or must not share an instance with
#      users' requests -- nothing in the current queue qualifies; see the
#      trade-off note in service-web.yaml.
#
# It is safe to run beside the in-process workers: River is built for several
# workers on one river_job table, jobs are leased to one of them, and cron
# serialises on an advisory lock whoever calls it. CRON_INPROCESS is unset
# here on purpose -- the schedule is the Scheduler's -- so a worker running
# next to the web service is only a second consumer, never a second clock.
#
# maxScale 1 because a second replica adds nothing the Postgres-bound
# Concurrency of 4 needs. Cloud Run requires every service container to
# listen on $PORT and answer the startup probe; cmd/worker does, when PORT is
# set, with a /healthz that reports the database's and the queue's health.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: temperp-worker
  labels:
    cloud.googleapis.com/location: asia-south1
  annotations:
    # Nobody calls the worker over HTTP; the port exists only so Cloud Run
    # can see it is alive. Internal ingress keeps it off the public internet.
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        # CPU allocated between requests: the queue consumer does all its
        # work with no request in flight. This annotation is the whole bill.
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: temperp-run@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/temperp/app:COMMIT
          command: ["/app/worker"]
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              # 1 vCPU matches the plan. The worker is Postgres-bound at
              # Concurrency 4, so "0.5" would very likely do and halves the
              # always-on charge; see the cost note in the doc before lowering.
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          env:
            - name: HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: APP_ENV
              value: production
            - name: BASE_URL
              value: "BASE_URL_VALUE"
            - name: SESSION_TTL
              value: 12h
            - name: SESSION_IDLE_TTL
              value: 2h
            # A single instance with Concurrency 4 needs far fewer than the
            # web's pool, and every connection here is one the web cannot
            # have on Neon's connection ceiling.
            - name: DB_MAX_CONNS
              value: "4"
            - name: R2_ACCOUNT_ID
              value: "R2_ACCOUNT_ID_VALUE"
            - name: R2_BUCKET
              value: "R2_BUCKET_VALUE"
            - name: R2_PUBLIC_HOST
              value: "R2_PUBLIC_HOST_VALUE"
            - name: R2_PRESIGN_EXPIRY
              value: 10m
            - name: FILE_STORE_DIR
              value: /tmp/temperp-files
            # Push to the parent app (docs/PUSH.md) reads a service-account
            # JSON from disk. On Cloud Run that file is a Secret Manager
            # volume. Both halves are commented out until the secret exists,
            # because a reference to a missing secret fails the whole revision
            # -- uncomment together with the volume block below.
            # - name: FCM_SERVICE_ACCOUNT_FILE
            #   value: /secrets/fcm/service-account.json
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: temperp-database-url
                  key: latest
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: temperp-migrate-database-url
                  key: latest
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: temperp-session-secret
                  key: latest
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: temperp-password-pepper
                  key: latest
            - name: CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: temperp-credential-key
                  key: latest
            - name: PAYMENT_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: temperp-payment-gateway-secret
                  key: latest
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: temperp-r2-access-key-id
                  key: latest
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: temperp-r2-secret-access-key
                  key: latest
          # volumeMounts:
          #   - name: fcm
          #     mountPath: /secrets/fcm
          #     readOnly: true
      # volumes:
      #   - name: fcm
      #     secret:
      #       secretName: temperp-fcm-service-account
      #       items:
      #         - key: latest
      #           path: service-account.json
  traffic:
    - percent: 100
      latestRevision: true
